<style>

header{position:sticky;top:0;z-index:10;background:rgba(15,23,42,.97);border-bottom:1px solid var(--line);padding:8px 10px 0;padding-top:max(8px,env(safe-area-inset-top))}
.top{display:flex;align-items:center;gap:8px;justify-content:space-between}
.top h1{font-size:16px;margin:0;font-weight:700}.top h1 small{display:block;font-size:11px;color:var(--mut);font-weight:400}
.phase{display:flex;gap:4px;align-items:center}.phase span{font-size:11px;color:var(--mut);margin-right:2px}
.phase button{width:34px;height:34px;border-radius:9px;border:2px solid var(--line);background:var(--card);color:var(--tx);font-weight:800;font-size:15px}

nav a{flex:0 0 auto;padding:7px 11px;border-radius:999px;background:var(--card);color:var(--tx);text-decoration:none;font-size:13px;border:1px solid var(--line);white-space:nowrap}

.warn{border-color:#7c2d12;background:#2a1a12}
.zone{border-left:6px solid;padding-left:10px}.zg{border-color:var(--g)}.za{border-color:var(--a)}.zr{border-color:var(--r)}
ul,ol{padding-left:20px;margin:6px 0}li{margin:4px 0}

.was{font-size:12px;color:var(--mut);text-decoration:line-through}

.chip{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 7px;margin:0 4px 3px 0;color:#111}
.gchip{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 7px;margin:0 4px 3px 0;border:1px solid}
.note{font-size:13px;margin-top:5px}.cue{font-size:12.5px;color:#cbd5e1;margin-top:4px}
.flag{font-size:12.5px;color:#fde68a;margin-top:4px}
.kn{font-size:12.5px;color:#c4b5fd;margin-top:4px}
.media{display:flex;gap:8px;padding:0 12px 10px;align-items:stretch}
.pose{flex:0 0 44%;background:#0b1220;border-radius:10px;border:1px solid var(--line);position:relative;cursor:pointer}
.pose canvas{width:100%;height:auto;aspect-ratio:440/340;display:block}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.hgrid label{display:flex;flex-direction:column;font-size:13px;color:var(--mut)}.hgrid input{min-width:0;width:100%;box-sizing:border-box;padding:8px;border-radius:8px;border:1px solid var(--line);background:#0b1220;color:#e2e8f0;font-size:16px}.ht{width:100%;font-size:13px;border-collapse:collapse;margin:6px 0}.ht td{padding:3px 4px;border-bottom:1px solid var(--line)}.hl{font-size:14px;margin:3px 0}.guide li{margin:4px 0}.guide ol ol{list-style:lower-alpha}#rdur,#rint{padding:6px;border-radius:6px;background:#0b1220;color:#e2e8f0;border:1px solid var(--line);font-size:16px}

.pose .cap{position:absolute;left:5px;bottom:2px;font-size:13px;color:var(--acc2);font-weight:700;opacity:.8}
.media.big{flex-direction:column}.media.big .pose{flex:1 1 auto}
.vids{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}

.cell{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--pc,#334155);border-radius:8px;min-height:66px;padding:3px 4px 15px;font-size:10.5px;color:var(--tx);text-decoration:none;display:block;position:relative}

/* --- target muscle glow --- */
function musclePt(J,m){const B=J.B,pj=J.pj,TU=(x,y,z)=>V3(V3(K3(B.lt,x),K3(B.up,-y)),K3(B.fw,z));const mid=(a,b,t)=>V3(K3(a,1-(t||.5)),K3(b,t||.5));const L=m.endsWith("L"),k=L?"L":"R",sx=L?1:-1;const base=L?m.slice(0,-1):m;
 const sh=B["s"+k],el=B["e"+k],hp=B["hip"+k],kn=B["k"+k],an=B["a"+k];
 const lfw=v=>{const t=B["lf"+k];const d=V3(kn,K3(hp,-1));return d};
 switch(base){case"supra":return [pj(V3(sh,TU(sx*-3,7,-3))),11];case"delt":return [pj(mid(sh,el,.22)),12];case"cuff":return [pj(V3(sh,TU(sx*-4,-6,-9))),12];
 case"serr":return [pj(TU(sx*17,-46,6)),12];case"traps":return [pj(TU(sx*10,-76,-4)),12];case"rhomb":return [pj(TU(sx*8,-58,-11)),13];case"chest":return [pj(TU(sx*10,-56,14)),14];

 case"quads":{const t=B["lf"+k];const perp=sg(Math.atan2(t[2],t[1])/D2R+90);return [pj(V3(mid(hp,kn),K3(perp,7))),13]}

 case"glutes":return [pj(V3(hp,[0,-2,-12])),13];case"abd":return [pj(V3(hp,[sx*11,-2,0])),11];case"add":return [pj(V3(mid(hp,kn,.4),[-sx*8,0,0])),11];

function drawGlow(c,J,list,v){if(!list)return;const a=.28+.3*(v==null?.6:v);list.forEach(m=>{const r=musclePt(J,m);if(!r)return;const [p,rad]=r,R=rad*J.P.s*1.25;const leg=/quads|hams|glutes|abd|add|calf/.test(m);const col=leg?"250,204,21":"255,110,40";const g=c.createRadialGradient(p[0],p[1],0,p[0],p[1],R);g.addColorStop(0,`rgba(${col},${a})`);g.addColorStop(.6,`rgba(${col},${a*.55})`);g.addColorStop(1,`rgba(${col},0)`);c.fillStyle=g;c.beginPath();c.arc(p[0],p[1],R,0,7);c.fill()})}
/* --- 2D IK for side views (sagittal limbs) --- */
function ik2(root,tgt,l1,l2,bend){const dx=tgt[0]-root[0],dy=tgt[1]-root[1];let d=Math.hypot(dx,dy);d=Math.max(Math.abs(l1-l2)+.01,Math.min(d,l1+l2-.01));const a=Math.atan2(dy,dx);const cA=Math.acos(Math.max(-1,Math.min(1,(l1*l1+d*d-l2*l2)/(2*l1*d))));const ang=a+bend*cA;return [root[0]+l1*Math.cos(ang),root[1]+l1*Math.sin(ang)]}
function phiOf(a,b,sgn){return Math.atan2(sgn*(b[0]-a[0]),b[1]-a[1])/D2R}
function applyIK(P,spec,J,v){const ik=spec.ik;if(!ik)return P;const sgn=Math.sin(spec.cam*D2R)>=0?1:-1;const s=P.s;P=Object.assign({},P);
 const arm=(k,T)=>{const sP=J["s"+k];let best=null;[1,-1].forEach(b=>{const E=ik2(sP,T,SEG.ua*s,(SEG.fa+5)*s,b);const fu=phiOf(sP,E,sgn),ff=phiOf(E,T,sgn);let e=ff-fu;while(e>180)e-=360;while(e<-180)e+=360;if(e>=-2&&(!best||e<best.e))best={fu,e}});if(!best)return;P["f"+k]=best.fu-P.p+P.tf;P["e"+k]=Math.max(0,best.e)};
 const leg=(k,T,toe)=>{const hp=J["hip"+k];let best=null;[1,-1].forEach(b=>{const Kn=ik2(hp,T,SEG.th*s,SEG.sh*s,b);const ft=phiOf(hp,Kn,sgn),fs=phiOf(Kn,T,sgn);let kk=ft-fs;while(kk>180)kk-=360;while(kk<-180)kk+=360;if(kk>=-1&&(!best||kk<best.k))best={ft,fs,k:kk}});if(!best)return;P["hf"+k]=best.ft-P.p;P["k"+k]=Math.max(0,best.k);if(toe){const ff=phiOf(T,toe,sgn);P["an"+k]=(best.fs+90)-ff}};
 if(ik.R)arm("R",ik.R(v,J));if(ik.L)arm("L",ik.L(v,J));if(ik.RL){const r=ik.RL(v,J);leg("R",r[0]?r:r,r.toe)}if(ik.LL){const r=ik.LL(v,J);leg("L",r,r.toe)}
 return P}

<ul>

<li><b>Start Date</b> <b>is today</b></li>
<li><b>Group By</b> = <b>Day</b></li>

<li>Add <b>Round Number</b> (Ones Place). Long-press its output, choose <b>Rename</b>, and call it <code style='word-break:break-all;background:#0b1220;padding:1px 4px;border-radius:4px'>Steps</code>.</li>

<li><b>Active energy</b></li>

<ul>

<li><b>Start Date</b> <b>is today</b></li>
<li><b>Group By</b> = <b>Day</b></li>

<li>Rename the output <code style='word-break:break-all;background:#0b1220;padding:1px 4px;border-radius:4px'>Day</code>.</li>
</ul>
<li>Add a <b>URL</b> action and type the link, inserting each variable from the bar above the keyboard:</li>
<div><code style='word-break:break-all;background:#0b1220;padding:1px 4px;border-radius:4px'>https://vishanya.github.io/rehab-plan/?steps=[Steps]&amp;active_kcal=[Active]&amp;resting_kcal=[Resting]&amp;total_kcal=[Total]&amp;date=[Day]</code></div>
<div>If you built step 5, you can also add <code style='word-break:break-all;background:#0b1220;padding:1px 4px;border-radius:4px'>&amp;distance_km=[Distance]&amp;exercise_min=[ExMin]</code>.</div>
<li>Add <b>Open URLs</b> (input: the URL).</li>
<li>Tap <b>Done</b>, then run the shortcut once. Allow Health access when iOS asks, and choose <b>Always Allow</b> on the "share samples" prompt. The app opens and shows <b>"Health data imported"</b>.</li>
</ol>
<h3>Add it to your Home Screen</h3>
<p>Long-press the shortcut, then <b>Share → Add to Home Screen</b>. Pick an icon, then tap <b>Add</b>. One tap now imports today's numbers.</p>
<h3>Optional: make it run automatically</h3>
<p><b>Automation</b> tab → <b>+</b> (or <b>New Automation</b>) → choose a trigger:</p>
<ul>
<li><b>Time of Day</b>: for example 9:00 PM, Daily.</li>
<li><b>Leave</b>: choose your gym's location. It runs when you leave the gym.</li>
</ul>
<p>Then pick <b>Run Immediately</b> (turn off <b>Notify When Run</b> if you like) and choose the <b>Rehab Health</b> shortcut. The phone must be unlocked for it to open the app; otherwise you get a notification to tap.</p>
<h3>Tips</h3>
<ul>
<li>If the step count looks higher than in the Health app, it's because the iPhone and Apple Watch both record steps. Make sure <b>Group By = Day</b> is set; if it's still high, add a filter <b>Source is [your Apple Watch]</b>.</li>
<li>Health active kcal already includes your gym workout if you wore your watch or phone. The app's <b>Gym estimate</b> is a separate MET-based estimate; <b>don't add the two together</b>.</li>
<li>No Shortcut handy? Use <b>Today → Enter or edit manually</b> in the app.</li>
<li>Re-running the shortcut on the same day just updates that day's numbers.</li>
</ul></div>`;

/* ===== Fitbit Web API (OAuth2 Auth Code + PKCE, client-side) ===== */
const FITBIT_CLIENT_ID="";/* set after registering at dev.fitbit.com (type: Client) — or paste it in the app's Fitbit settings */
const FB_SCOPES="activity heartrate profile";const FB_API="https://api.fitbit.com";
function fbCid(){return (LS.get("fb_cid","")||FITBIT_CLIENT_ID||"").trim()}
function fbRedirect(){return location.origin+location.pathname}
function fbTok(){return LS.get("fb_tok",null)}
function b64u(buf){let s="";new Uint8Array(buf).forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function rnd(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return b64u(a)}
async function fbConnect(){const cid=fbCid();if(!cid){toast("Add your Fitbit Client ID in settings first");location.hash="#fitbit";return}
 const ver=rnd(48),st=rnd(16);const ch=b64u(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(ver)));
 sessionStorage.setItem("fb_pkce",JSON.stringify({ver,st}));localStorage.setItem("vr2_fb_pkce",JSON.stringify({ver,st}));
 location.href="https://www.fitbit.com/oauth2/authorize?"+new URLSearchParams({response_type:"code",client_id:cid,scope:FB_SCOPES,code_challenge:ch,code_challenge_method:"S256",redirect_uri:fbRedirect(),state:st})}
async function fbTokenReq(p){const r=await fetch(FB_API+"/oauth2/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams(Object.assign({client_id:fbCid()},p))});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.errors&&j.errors[0]&&j.errors[0].message)||("token HTTP "+r.status));
 const t={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||28800)*1000-60000,uid:j.user_id,scope:j.scope};LS.set("fb_tok",t);return t}
async function fbCallback(){let q;try{q=new URLSearchParams(location.search)}catch(e){return}if(!q.has("code")&&!q.has("error"))return;
 const pk=JSON.parse(sessionStorage.getItem("fb_pkce")||localStorage.getItem("vr2_fb_pkce")||"null");try{history.replaceState(null,"",location.pathname+"#today")}catch(e){}
 if(q.has("error")){toast("Fitbit: "+q.get("error"));return}
 if(!pk||pk.st!==q.get("state")){toast("Fitbit sign-in failed (state mismatch) – try again");return}
 try{await fbTokenReq({grant_type:"authorization_code",code:q.get("code"),code_verifier:pk.ver,redirect_uri:fbRedirect()});localStorage.removeItem("vr2_fb_pkce");sessionStorage.removeItem("fb_pkce");toast("Fitbit connected ✓");await fbSync(TODAYK);await fbSyncRange(TODAYK,6,true);route()}catch(e){toast("Fitbit: "+e.message)}}
async function fbGet(path){let t=fbTok();if(!t)throw new Error("not connected");
 if(Date.now()>t.exp)t=await fbTokenReq({grant_type:"refresh_token",refresh_token:t.rt});
 let r=await fetch(FB_API+path,{headers:{Authorization:"Bearer "+t.at,"Accept-Language":"en_CA"}});
 if(r.status===401){t=await fbTokenReq({grant_type:"refresh_token",refresh_token:t.rt});r=await fetch(FB_API+path,{headers:{Authorization:"Bearer "+t.at,"Accept-Language":"en_CA"}})}
 if(r.status===429)throw new Error("Fitbit rate limit – try again in an hour");if(!r.ok)throw new Error("Fitbit HTTP "+r.status);return r.json()}
async function fbSync(k,quiet){const s=await fbGet(`/1/user/-/activities/date/${k}.json`);const S=s.summary||{};
 let azm=null;try{const a=await fbGet(`/1/user/-/activities/active-zone-minutes/date/${k}/1d.json`);const v=(a["activities-active-zone-minutes"]||[])[0];azm=v?v.value.activeZoneMinutes:0}catch(e){}
 const dist=(S.distances||[]).find(d=>d.activity==="total");
 const vals={steps:S.steps,total_kcal:S.caloriesOut,active_kcal:S.activityCalories,resting_kcal:S.caloriesBMR,distance_km:dist?Math.round(dist.distance*100)/100:null,azm,rhr:S.restingHeartRate!=null?S.restingHeartRate:null,
  exercise_min:(S.fairlyActiveMinutes||0)+(S.veryActiveMinutes||0),
  acts:(s.activities||[]).map(a=>({n:a.name||a.activityName,min:Math.round((a.duration||0)/60000),kcal:a.calories,st:a.startTime}))};
 Object.keys(vals).forEach(x=>vals[x]==null&&delete vals[x]);
 const H=LS.get("health",{});H[k]=Object.assign({},H[k]||{},vals,{src:"Fitbit",at:Date.now()});LS.set("health",H);if(!quiet)toast("Fitbit synced ✓ "+k);return vals}
async function fbSyncRange(k,n,quiet){for(let i=1;i<=n;i++){const dk=dkey(addD(parseK(k),-i));try{await fbSync(dk,true)}catch(e){if(/rate/.test(e.message))break}}if(!quiet)toast("Fitbit: synced 7 days ✓")}
function fbDisconnect(){const t=fbTok();if(t)fetch(FB_API+"/oauth2/revoke",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:fbCid(),token:t.rt||t.at})}).catch(()=>{});localStorage.removeItem("vr2_fb_tok");toast("Fitbit disconnected");route()}
PAGES.fitbit=()=>{const t=fbTok();return `<p><a href="#today" style="color:var(--acc2)">‹ Daily report</a></p><h2>⌚ Fitbit (Charge 6)</h2>
 <div class="box"><b>Status:</b> ${t?`✅ Connected${t.uid?" (user "+esc(t.uid)+")":""}`:"Not connected"}<p class="sub">Pulls steps, total/active/BMR calories, Active Zone Minutes, resting heart rate, distance and logged exercises for any day. Tokens stay only on this phone.</p>
 <div class="row">${t?`<button class="btn" data-fb="sync">Sync today</button><button class="btn sec" data-fb="sync7">Sync last 7 days</button><button class="btn sec" data-fb="off">Disconnect</button>`:`<button class="btn" data-fb="conn">Connect Fitbit</button>`}</div></div>
 <div class="box"><b>Fitbit Client ID</b><p class="sub">From dev.fitbit.com → Manage → your app (OAuth 2.0 Client ID, 6 characters). Redirect URL must be exactly <code>${esc(fbRedirect())}</code></p>
 <div class="row"><input id="fbcid" value="${esc(fbCid())}" placeholder="e.g. 23ABCD" style="padding:8px;border-radius:8px;background:#0b1220;color:#e2e8f0;border:1px solid var(--line)"><button class="btn sec" data-fb="savecid">Save</button></div></div>
 <div class="box sub">Sync your Charge 6 to the Fitbit phone app first, then press Sync here. No Fitbit? Use manual entry or the Apple Health Shortcut on the Daily report.</div>`};
document.addEventListener("click",async ev=>{const b=ev.target.closest("[data-fb]");if(!b)return;const a=b.dataset.fb,k=window._rd||TODAYK;
 try{if(a==="conn")await fbConnect();if(a==="off")fbDisconnect();if(a==="savecid"){LS.set("fb_cid",document.getElementById("fbcid").value.trim());toast("Client ID saved");route()}
 if(a==="sync"){b.disabled=true;await fbSync(k);route()}if(a==="sync7"){b.disabled=true;await fbSync(k,true);await fbSyncRange(k,6);route()}}catch(e){toast("Fitbit: "+e.message);b.disabled=false}});

 if(k==="d"&&h.split("/")[1]){renderNav("cal");document.getElementById("main").innerHTML=datePage(h.split("/")[1]);setupAnims();return}
 if(!PAGES[k])k=LS.get("tab",null)||"cal";if(!PAGES[k])k="cal";LS.set("tab",k);renderNav(k);
 document.getElementById("main").innerHTML=PAGES[k]()+`<div class="foot">Plan v2 (physio program integrated) · Oct 10, 2026 · works offline once loaded (videos need internet) · data saved on this device only.</div>`;
 if(k==="knee"){const K=LS.get("knee",{});const s=document.getElementById("stsmode");s.value=K.mode||"reps";s.onchange=()=>{const K2=LS.get("knee",{});K2.mode=s.value;LS.set("knee",K2);kneeCalc()};kneeCalc()}

/* animation loop */
let RAF=null,ACTIVE=[];
function setupAnims(){ACTIVE=[];const io=("IntersectionObserver" in window)?new IntersectionObserver(es=>es.forEach(e=>e.target._vis=e.isIntersecting),{rootMargin:"60px"}):null;
 document.querySelectorAll("canvas[data-v]").forEach(cv=>{cv._vis=!io;cv._t0=performance.now()-Math.random()*1500;if(io)io.observe(cv);const c=cv.getContext("2d");c.clearRect(0,0,440,340);try{drawVar(c,cv.dataset.v,0,true)}catch(e){};ACTIVE.push(cv)});
 if(!RAF)RAF=requestAnimationFrame(tick)}
let LASTF=0;function tick(now){RAF=requestAnimationFrame(tick);if(now-LASTF<33)return;LASTF=now;ACTIVE.forEach(cv=>{if(!cv._vis||!cv.isConnected||cv._paused)return;const c=cv.getContext("2d");const t=(now-cv._t0)/1000;c.clearRect(0,0,440,340);c.save();try{drawVar(c,cv.dataset.v,t,false)}catch(e){};c.restore()})}
renderPhaseSel();route();
